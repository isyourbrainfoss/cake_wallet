name: Cake Wallet Linux arm64 (native)

# Native aarch64 Linux build on GitHub's free arm64 runners (public repos).
# Uses the arm64 variant of the upstream multi-arch build image.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the Flatpak bundle as a GitHub Release and notify isyourbrainfoss/flatpak
        type: boolean
        default: false
  push:
    # flatpak/** lets branch PRs exercise the full build; only linux-arm64 and mobile-v* tags release.
    branches: [linux-arm64, 'flatpak/**']
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  CW_IMAGE: ghcr.io/cake-tech/cake_wallet:debian13-flutter3.41.9-ndkr28-go1.24.1-ruststablenightly

defaults:
  run:
    shell: bash

jobs:
  monero:
    # Runs on the host of ubuntu-26.04-arm rather than in the Debian 13 build image:
    # monero_c's simplybs downloads a prebuilt native clang21-aarch64-linux-gnu toolchain
    # (MrCyjaneK/easybs r0) that needs GLIBC_2.42 at build time; Debian 13 has 2.41.
    # Target libraries are linked against simplybs' own crosstool-ng sysroot.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        coin: [monero, wownero]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Host build deps
        run: |
          ldd --version | head -1
          # Most of these are preinstalled on the runner image; only fetch what is missing so a
          # flaky mirror (11 Nov: DNS failures for azure.archive.ubuntu.com on ubuntu-26.04-arm)
          # cannot fail the job when nothing needs downloading.
          pkgs="build-essential autoconf automake libtool pkg-config gperf cmake python3 git curl xz-utils unzip bzip2 file"
          need=()
          for p in $pkgs; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || need+=("$p")
          done
          if [ ${#need[@]} -eq 0 ]; then
            echo "All host build deps already installed"
            exit 0
          fi
          echo "Missing: ${need[*]}"
          apt_install() {
            sudo apt-get update -o Acquire::Retries=5 &&
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 "${need[@]}"
          }
          for attempt in 1 2 3; do
            apt_install && exit 0
            echo "apt failed (attempt $attempt/3), retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          # Fallback: bypass the runner's mirror list and talk to ports.ubuntu.com (arm64 archive).
          echo "Switching apt sources to ports.ubuntu.com"
          for f in /etc/apt/sources.list.d/*.sources /etc/apt/sources.list; do
            [ -f "$f" ] || continue
            sudo sed -i -E 's#^(URIs:).*#\1 http://ports.ubuntu.com/ubuntu-ports/#; s#(deb(-src)? )(\[[^]]*\] )?[a-z+]+:[^ ]+#\1\3http://ports.ubuntu.com/ubuntu-ports/#' "$f"
          done
          for attempt in 1 2 3; do
            apt_install && exit 0
            sleep $((attempt * 30))
          done
          exit 1
      - name: Cache monero_c build
        id: cache
        uses: actions/cache@v4
        with:
          path: scripts/monero_c/release
          key: monero_c-${{ matrix.coin }}-aarch64-linux-gnu-${{ hashFiles('scripts/prepare_moneroc.sh', 'scripts/linux/build_monero_all.sh') }}
      # simplybs keeps every built native tool / target dep under .buildlib/<builder>/built and skips
      # packages whose .info.txt still matches. Restore it, and save it even when the build fails or
      # times out, so the multi-hour toolchain bootstrap is only paid once.
      - name: Restore simplybs build cache
        if: steps.cache.outputs.cache-hit != 'true'
        id: sbs
        uses: actions/cache/restore@v4
        with:
          path: scripts/monero_c/contrib/depends/simplybs/.buildlib/linux_arm64/built
          key: sbs-built-linux_arm64-aarch64-linux-gnu-${{ hashFiles('scripts/prepare_moneroc.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.coin }}
          restore-keys: |
            sbs-built-linux_arm64-aarch64-linux-gnu-${{ hashFiles('scripts/prepare_moneroc.sh') }}-
      - name: Build ${{ matrix.coin }}
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 330
        run: bash scripts/linux/arm64/ci_step.sh monero ${{ matrix.coin }}
      - name: Save simplybs build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scripts/monero_c/contrib/depends/simplybs/.buildlib/linux_arm64/built
          key: sbs-built-linux_arm64-aarch64-linux-gnu-${{ hashFiles('scripts/prepare_moneroc.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.coin }}
      - name: Inspect libraries
        run: |
          for f in scripts/monero_c/release/*/aarch64-linux-gnu/*; do
            file "$f"
            case "$f" in *.so) objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1;; esac
          done
      - name: Disk usage
        if: always()
        run: df -h
      - uses: actions/upload-artifact@v4
        with:
          name: monero_c-${{ matrix.coin }}-aarch64
          path: scripts/monero_c/release
          if-no-files-found: error

  zcash:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Disk space
        run: df -h
      - name: Cache zcash build
        id: cache
        uses: actions/cache@v4
        with:
          path: scripts/zcash_lib/target/release/libwarp_api_ffi.so
          key: zcash-aarch64-linux-gnu-${{ hashFiles('scripts/prepare_zcash.sh', 'scripts/linux/build_zcash.sh') }}
      - name: Build zcash lib
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/in_image.sh zcash
      - uses: actions/upload-artifact@v4
        with:
          name: zcash-aarch64
          path: scripts/zcash_lib/target/release/libwarp_api_ffi.so
          if-no-files-found: error

  app:
    needs: [monero, zcash]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Disk space
        run: df -h
      - name: Toolchain info
        run: .github/scripts/in_image.sh info
      - name: monero_c checkout (for git describe)
        run: .github/scripts/in_image.sh monero_c_checkout
      - uses: actions/download-artifact@v4
        with:
          pattern: monero_c-*-aarch64
          path: scripts/monero_c/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: zcash-aarch64
          path: scripts/zcash_lib/target/release
      - name: Dart-only deps (bitbox clone, torch_dart source, mweb ffigen)
        run: .github/scripts/in_image.sh dart_deps
      - name: reown (Dart codegen only, no Android native)
        run: .github/scripts/in_image.sh reown
      - name: Configure and build app
        run: .github/scripts/in_image.sh app
      - name: Disk usage
        if: always()
        run: df -h
      - name: Pack bundle (tarball keeps file modes)
        run: sudo tar czf cakewallet_linux_arm64_bundle.tar.gz -C build/linux/arm64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cakewallet_linux_arm64_bundle
          path: cakewallet_linux_arm64_bundle.tar.gz
          if-no-files-found: error

  flatpak:
    needs: app
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cakewallet_linux_arm64_bundle
          path: ${{ runner.temp }}
      - name: Build Flatpak
        run: .github/scripts/build_flatpak.sh "${{ runner.temp }}/cakewallet_linux_arm64_bundle.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cakewallet_mobile_aarch64_flatpak
          path: io.github.isyourbrainfoss.CakeWalletMobile-aarch64.flatpak
          if-no-files-found: error

  # Publishes the bundle for the shared, signed Flatpak repo (https://isyourbrainfoss.github.io/flatpak/).
  # isyourbrainfoss/flatpak imports the release asset and signs it there; no signing key lives here.
  release:
    needs: flatpak
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/linux-arm64' || startsWith(github.ref, 'refs/tags/mobile-v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cakewallet_mobile_aarch64_flatpak
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=io.github.isyourbrainfoss.CakeWalletMobile-aarch64.flatpak
          sha256sum "$asset" > "$asset.sha256"
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="mobile-r${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Cake Wallet Mobile (Flatpak, aarch64) $tag" \
            --notes "Community aarch64 Flatpak bundle built from ${GITHUB_SHA}. Install with updates from https://isyourbrainfoss.github.io/flatpak/"
      - name: Notify isyourbrainfoss/flatpak
        env:
          DISPATCH_TOKEN: ${{ secrets.FLATPAK_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::notice::FLATPAK_DISPATCH_TOKEN not set; the shared repo picks this release up on its weekly run or a manual run."
            exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/isyourbrainfoss/flatpak/dispatches \
            -f event_type=app-updated \
            -F 'client_payload[app]=io.github.isyourbrainfoss.CakeWalletMobile' \
            -F "client_payload[tag]=${TAG}"
